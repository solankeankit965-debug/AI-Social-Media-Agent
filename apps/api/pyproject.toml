[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-agent-api"
version = "0.1.0"
description = "FastAPI and LangGraph backend for the AI Social Media Agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy>=2.0.36,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "langgraph>=0.2.50,<1.0",
  "celery[redis]>=5.4,<6.0",
  "httpx>=0.27,<1.0",
  "cryptography>=43,<45"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

